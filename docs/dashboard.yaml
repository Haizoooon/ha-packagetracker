# Example dashboard
title: Parcels
views:
  - title: Deliveries
    path: parcels
    icon: mdi:package-variant-closed
    cards:
      - type: custom:package-tracker-card
        title: In transit
        max_packages: 12
        show_delivered: false
        show_images: true
        show_delivery_dates: true
        compact: false
        default_filter: transit
        sort_by: expected
        show_stats: true
        show_search: true
        show_last_sync: true

      - type: custom:package-tracker-card
        title: Delivered
        max_packages: 8
        show_delivered: true
        default_filter: delivered
        sort_by: expected
        show_stats: false
        compact: true

      - type: entities
        title: Parcel overview
        entities:
          - entity: sensor.package_tracker_packages
            name: Active parcels
          - entity: sensor.package_tracker_deliveries_today
            name: Deliveries today
          - entity: sensor.package_tracker_delivered_today
            name: Delivered today
          - entity: sensor.package_tracker_packages_in_transit
            name: In transit
          - entity: sensor.package_tracker_delayed
            name: Delayed
          - entity: sensor.package_tracker_next_delivery
            name: Next delivery
